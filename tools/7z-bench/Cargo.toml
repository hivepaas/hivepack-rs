[package]
name = "sevenz-bench"
version = "0.0.0"
description = "Times hivepack::sevenz against the LZMA SDK's 7z decoder and 7-Zip on the same archives"
publish = false
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
unsafe-fast = ["hivepack/deflate-unsafe-fast"]

[dependencies]
hivepack = { workspace = true, features = ["sevenz"] }
