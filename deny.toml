# cargo deny check: every dependency must be under a permissive license, come
# from crates.io, and have no open security advisory.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  # Apache-2.0 with an exception that only grants more: winx, which cap-std
  # takes on Windows, has no other license.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # BSD-style, with zlib's rule that altered versions say so: libbzip2's,
  # which hivepack::bzip2, a port of it, keeps.
  "bzip2-1.0.6",
  # BSD Zero Clause: liblzma's, which hivepack::xz, a port of it, keeps.
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# UnRAR's own license, which OSI does not approve: for hivepack, whose `rar`
# module is a port of UnRAR and off by default (docs/rar.md), and for
# rar-bench, a tool that is not published, which links it and UnRAR.
exceptions = [
  { name = "hivepack", allow = ["UnRAR"] },
  { name = "rar-bench", allow = ["UnRAR"] },
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
