# cargo deny check: every dependency must be under a permissive license, come
# from crates.io, and have no open security advisory.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  # Apache-2.0 with an exception that only grants more: winx, which cap-std
  # takes on Windows, has no other license.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # BSD-style, with zlib's rule that altered versions say so: libbzip2's,
  # which hivepack::bzip2, a port of it, keeps.
  "bzip2-1.0.6",
  # BSD Zero Clause: liblzma's, which hivepack::xz, a port of it, keeps.
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# UnRAR's own license, which OSI does not approve: for hivepack, whose `rar`
# module is a port of UnRAR and off by default (docs/rar.md), and for
# rar-bench, a tool that is not published, which links it and UnRAR.
exceptions = [
  { name = "hivepack", allow = ["UnRAR"] },
  { name = "rar-bench", allow = ["UnRAR"] },
]

[advisories]
yanked = "deny"
# RUSTSEC-2026-0544, a heap buffer overflow in zlib 1.3.1.2 through 1.3.2,
# against libz-sys, which this workspace pins to =1.1.31 because it bundles
# the zlib release hivepack::deflate ports and is the oracle that port is
# checked against. Ignored rather than bumped, for three measured reasons:
#
#   * libz-sys and flate2 are dev-dependencies of hivepack (`cargo metadata`
#     says `kind=dev` for each), so nothing published carries them and no
#     one who installs hivepack gets either.
#   * the overflow is in zlib's gzFile API -- `gz_vacate`, reached through
#     `gzprintf` or `gzvprintf`. Nothing here calls it: the two `GzEncoder`
#     uses are in tests, and flate2 builds the gzip wrapper in Rust, with
#     no `gzprintf`, `gz_vacate`, `gzwrite` or `gzopen` in its source.
#     Only zlib's deflate and inflate are linked through.
#   * the upgrade the advisory names is not a patch release. libz-sys
#     1.1.33 bundles zlib **1.4**, where the pinned 1.1.31 bundles 1.3.2,
#     so taking it would stop the oracle being the release the port ports.
#
# Which leaves porting against zlib 1.4 as its own piece of work, with this
# ignore removed when it lands. docs/deflate.md says what the port ports.
ignore = [{ id = "RUSTSEC-2026-0544", reason = "libz-sys is a dev-dependency and zlib's gzFile API, where the overflow is, is never called: see the comment above" }]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
