[package]
name = "hivepack"
version = "0.9.0"
description = "Read and write archives and compressed files: ZIP, tar, 7z, RAR, zstd, xz, bzip2, lz4, deflate, age, ISO, UDF, cpio, XAR and more, in safe Rust"
license = "MIT AND BSD-2-Clause AND BSD-3-Clause AND Zlib AND 0BSD AND bzip2-1.0.6 AND Unicode-3.0 AND UnRAR"
readme = "README.md"
keywords = ["archive", "zip", "compression", "zstd", "extract"]
categories = ["compression", "encoding", "filesystem"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# Safe Rust, rule by rule: docs/safety.md. Modules without `unsafe-fast` code
# forbid `unsafe` in their own `mod.rs`; the three with it deny it, and allow
# it in the files that document each use (docs/unsafe.md).
[lints.rust]
unsafe_code = "deny"
# `cargo fuzz` builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Each format's module keeps the file names of the crate it was: `zip::zip`.
module_inception = "allow"

# docs.rs builds the default features unless told: memory, off by default for
# its unsafe calls to the system, is documented there too. Not rar, which takes
# UnRAR's license.
[package.metadata.docs.rs]
features = ["full", "memory"]

[features]
# Every format but RAR, whose code is under UnRAR's license: see LICENSE.md.
default = ["full"]

full = ["age", "bzip2", "cpio", "crypto", "deflate", "extract", "iso", "lz4", "open", "sevenz", "sign", "tar", "udf", "xar", "xz", "zip", "zstd"]

# How much memory the program may still take, and a budget to choose threads
# under it. Not a format, and so not in `full`: it calls the system through
# `unsafe` code on Windows and macOS, which the crate keeps off by default
# (docs/memory.md, docs/unsafe.md).
memory = ["dep:libc", "dep:rustix", "dep:windows-sys"]

# Faster code with some `unsafe` in it, off by default: docs/unsafe.md.
unsafe-fast = ["zstd-unsafe-fast", "lz4-unsafe-fast", "deflate-unsafe-fast"]
zstd-unsafe-fast = []
lz4-unsafe-fast = []
deflate-unsafe-fast = []

# One feature for each format; the ones it needs come with it.

age = ["crypto"]

bzip2 = []

cpio = []

crypto = [
  "dep:aes",
  "dep:blake2s_simd",
  "dep:chacha20poly1305",
  "dep:curve25519-dalek",
  "dep:ed25519-dalek",
  "dep:hkdf",
  "dep:hpke",
  "dep:ml-dsa",
  "dep:rand_core",
  "dep:hmac",
  "dep:md-5",
  "dep:pbkdf2",
  "dep:scrypt",
  "dep:sha1",
  "dep:sha2",
  "dep:subtle",
]

deflate = []

extract = ["zip", "tar", "iso", "cpio", "xar", "open", "udf", "sevenz", "dep:cap-std", "dep:cap-fs-ext", "dep:nix", "dep:rustix"]

iso = ["deflate"]

lz4 = []

open = ["age", "bzip2", "cpio", "deflate", "lz4", "xz", "zstd"]

rar = ["crypto", "deflate"]

sevenz = ["bzip2", "crypto", "deflate", "xz", "zstd"]

sign = ["age", "crypto"]

tar = []

udf = []

xar = ["bzip2", "crypto", "deflate", "xz"]

xz = []

zip = ["bzip2", "crypto", "deflate", "xz", "zstd"]

zstd = []

[dependencies]
# The cryptography itself, in crates many others depend on. Their `unsafe` code
# stays in them: see docs/safety.md and docs/crypto.md.
aes = { version = "0.9", features = ["zeroize"], optional = true }
blake2s_simd = { version = "1", optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables", "zeroize"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"], optional = true }
hkdf = { version = "0.13", optional = true }
# X-Wing under HPKE, age's post-quantum keys. Not independently audited: see
# docs/crypto.md.
hpke = { version = "0.15", default-features = false, features = ["alloc", "mlkem", "x25519", "chacha"], optional = true }
# ML-DSA, signatures that hold against a quantum computer. Not independently
# audited: see docs/crypto.md.
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"], optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }
hmac = { version = "0.13", optional = true }
md-5 = { version = "0.11", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
scrypt = { version = "0.12", default-features = false, optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
subtle = { version = "2", default-features = false, optional = true }
# Directories opened by handle, for `extract`.
cap-std = { workspace = true, optional = true }
cap-fs-ext = { workspace = true, optional = true }

# `ulimit`'s limits (getrlimit), for `memory`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, optional = true, features = ["process"] }
# Users and groups by name, for `extract`'s owners.
nix = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Extended attributes, for `extract`.
rustix = { workspace = true, optional = true }
# Users and groups by name, for `extract`'s owners.
nix = { workspace = true, optional = true }
# The system's page counts, for `memory`.
libc = { workspace = true, optional = true }

# The system's free memory and job objects, for `memory`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
# The reference libraries, to compress, decompress and compare with in tests.
zstd = { workspace = true, features = ["no_asm"] }
zstd-safe.workspace = true
libz-sys.workspace = true
flate2.workspace = true
bzip2.workspace = true
lz4.workspace = true
lz4-sys.workspace = true
liblzma.workspace = true
serde.workspace = true
serde_json.workspace = true

# `tests/memory_job.rs` puts its own process in a job object.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

