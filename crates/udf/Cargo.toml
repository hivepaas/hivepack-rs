[package]
name = "hivepack-udf"
version = "0.1.0"
description = "Reading UDF volumes (DVD, Blu-ray and disk images) in safe Rust, ported from NetBSD"
license = "BSD-2-Clause AND BSD-3-Clause"
readme = "README.md"
keywords = ["udf", "dvd", "bluray", "iso", "filesystem"]
categories = ["encoding", "filesystem"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The test images are kept compressed with xz.
hivepack-xz.workspace = true
# For the SHA-256 of files, which Linux's answers give.
hivepack-crypto.workspace = true
