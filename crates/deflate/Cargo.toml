[package]
name = "hivepack-deflate"
version = "0.1.0"
description = "Deflate, zlib and gzip compression and decompression in safe Rust, ported from the official library, zlib"
license = "Zlib"
readme = "README.md"
keywords = ["deflate", "zlib", "gzip", "inflate", "compression"]
categories = ["compression"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# CRC-32 with the processor's instructions on arm64, as zlib does where its
# build allows it: faster, at the cost of one `unsafe` call, in `src/crc32.rs`.
# Off by default: without it the crate has no unsafe code at all. See
# docs/unsafe.md.
unsafe-fast = []

# The workspace's lints, but `unsafe_code` is `deny` rather than `forbid`, so
# that the `unsafe-fast` feature's code can allow it. Without the
# feature, lib.rs forbids it again.
[lints.rust]
unsafe_code = "deny"
# `cargo fuzz` builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
# zlib 1.3.2, the reference (see the workspace's Cargo.toml).
libz-sys.workspace = true
flate2.workspace = true
