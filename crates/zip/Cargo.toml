[package]
name = "hivepack-zip"
version = "0.1.0"
description = "ZIP archives in safe Rust, the container logic ported from libzip"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["zip", "archive", "libzip"]
categories = ["compression", "encoding"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Faster CRC-32 from hivepack-deflate. See
# docs/unsafe.md.
unsafe-fast = ["hivepack-deflate/unsafe-fast"]

[lints]
workspace = true

[dependencies]
# CRC-32 and deflate, ported from zlib.
hivepack-deflate.workspace = true
# bzip2, ported from libbzip2.
hivepack-bzip2.workspace = true
# LZMA and XZ, ported from liblzma.
hivepack-xz.workspace = true
# Zstandard, ported from libzstd.
hivepack-zstd.workspace = true
# AES, HMAC-SHA1 and PBKDF2 for WinZip AES.
hivepack-crypto.workspace = true
