[package]
name = "hivepack-crypto"
version = "0.0.0"
description = "The cryptography of hivepack's formats, behind one small interface, from crates many others depend on"
license = "MIT"
readme = "README.md"
keywords = ["aes", "chacha20", "x25519", "scrypt"]
categories = ["cryptography"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# The cryptography itself, in crates many others depend on. Their `unsafe` code
# stays in them: see docs/safety.md and docs/crypto.md.
aes = { version = "0.9", features = ["zeroize"] }
blake2s_simd = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
hkdf = "0.13"
# X-Wing under HPKE, age's post-quantum keys. Not independently audited: see
# docs/crypto.md.
hpke = { version = "0.15", default-features = false, features = ["alloc", "mlkem", "x25519", "chacha"] }
# ML-DSA, signatures that hold against a quantum computer. Not independently
# audited: see docs/crypto.md.
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
rand_core = { version = "0.10", default-features = false }
hmac = "0.13"
md-5 = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
scrypt = { version = "0.12", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2", default-features = false }
